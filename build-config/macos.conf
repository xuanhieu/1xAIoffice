# configure options for the macOS build (one option per line, copied into autogen.input).
# Keep this list short: every option here must have a reason.

# Product identity shown in About, window titles, the app bundle and package metadata.
--with-vendor=1xVnOffice
--with-product-name=1xVnOffice

# Release build: drops the "Dev" suffix from the product name and uses release settings.
--enable-release-build

# Vietnamese and English UI; translations tarball required.
--with-lang=en-US vi

# Spelling dictionaries from the dictionaries tarball.
--with-myspell-dicts

# First builds skip the help tarball to save time; switch to --with-help=html in phase 2.
--without-help

# No TDF update service or crash upload: 1xVnOffice has its own signed updater.
--disable-online-update
--disable-crashdump

# No Java: fewer prerequisites; the Java-based Base wizards are not needed.
--without-java

--without-doxygen

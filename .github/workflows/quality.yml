name: quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      # TODO before the first public release: pin actions to a full commit SHA.
      - uses: actions/checkout@v4
      - name: Repository checks
        run: python3 scripts/check-repo.py
      - name: Shell lint
        run: shellcheck -x scripts/*.sh
      - name: Dry-run fetch plan
        run: scripts/fetch-source.sh --dry-run
